<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This is a user friendly Product Review Form that works well on both mobile and desktop screens"
    />
    <meta name="author" content="Ugwuanyi Chineme Charles" />
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/form.js" defer></script>
  </head>
  <body>
    <main class="form-container">
      <header class="form-header">
        <h1>Product Review</h1>
      </header>

      <form action="review.html" method="get" class="review-form">
        <div class="form-group">
          <label for="product-name">Product Name</label>
          <select id="product-name" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Overall Rating</label>
          <div class="rating-group">
            <div class="rating-item">
              <label for="rating-1">☆</label>
              <input
                type="radio"
                name="overallRating"
                id="rating-1"
                value="1"
                required
              />
            </div>
            <div class="rating-item">
              <label for="rating-2">☆☆</label>
              <input
                type="radio"
                name="overallRating"
                id="rating-2"
                value="2"
                required
              />
            </div>
            <div class="rating-item">
              <label for="rating-3">☆☆☆</label>
              <input
                type="radio"
                name="overallRating"
                id="rating-3"
                value="3"
                required
              />
            </div>
            <div class="rating-item">
              <label for="rating-4">☆☆☆☆</label>
              <input
                type="radio"
                name="overallRating"
                id="rating-4"
                value="4"
                required
              />
            </div>
            <div class="rating-item">
              <label for="rating-5">☆☆☆☆☆</label>
              <input
                type="radio"
                name="overallRating"
                id="rating-5"
                value="5"
                required
              />
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="installation-date">Date of Installation</label>
          <input
            type="date"
            id="installation-date"
            name="installationDate"
            required
          />
        </div>

        <div class="form-group">
          <label class="checkbox-group-title"
            >Which features did you find useful in the product?</label
          >
          <span class="instructions">(Check all that apply)</span>

          <div class="checkbox-wrapper">
            <input
              type="checkbox"
              id="feature-durability"
              name="features"
              value="durability"
            />
            <label for="feature-durability">Durability</label>
          </div>

          <div class="checkbox-wrapper">
            <input
              type="checkbox"
              id="feature-ease"
              name="features"
              value="ease-of-use"
            />
            <label for="feature-ease">Ease of Use</label>
          </div>

          <div class="checkbox-wrapper">
            <input
              type="checkbox"
              id="feature-performance"
              name="features"
              value="performance"
            />
            <label for="feature-performance">Performance</label>
          </div>

          <div class="checkbox-wrapper">
            <input
              type="checkbox"
              id="feature-design"
              name="features"
              value="design"
            />
            <label for="feature-design">Design</label>
          </div>
        </div>

        <div class="form-group">
          <label for="written-review"
            >Written Review <span class="optional">(Optional)</span></label
          >
          <textarea
            id="written-review"
            name="writtenReview"
            rows="5"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="user-name"
            >Your Name <span class="optional">(Optional)</span></label
          >
          <input type="text" id="user-name" name="userName" />
        </div>

        <div class="form-group">
          <input type="submit" value="Post Review" class="submit-btn" />
        </div>
      </form>

      <footer class="assignment-footer">
        <p>©2026 🌺 Ugwuanyi Chineme Charles 🌺</p>
        <p>Nigeria</p>
        <p>Last Modification: 02/26/2024 13:56:10</p>
        <div id="counter-display" class="counter-box"></div>
      </footer>
    </main>
  </body>
</html>
